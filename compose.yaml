services:
  browser-vault:
    image: browser-vault-browser-vault
    build:
      context: .
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION}
    init: true
    ipc: host
    environment:
      BROWSER_VAULT_HOME: /vault
      BROWSER_VAULT_HEADLESS: "1"
    volumes:
      - ./data:/vault
